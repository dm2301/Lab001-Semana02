version: '3.8'

services:
  api1:
    build: .
    ports:
      - "3001:3000"
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  postgres-data:
