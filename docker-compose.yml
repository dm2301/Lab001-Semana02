version: '3.8'

services:
  api1:
    build: .
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - MESSAGE=${MESSAGE}

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
